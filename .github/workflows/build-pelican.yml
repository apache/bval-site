name: Build Pelican Website
on:
  push:
    # main publishes the live site; preview/* branches build to the
    # asf-staging branch, served at https://bval.staged.apache.org
    branches: [ "main", "preview/*" ]
  workflow_dispatch:
jobs:
  build-pelican:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: apache/infrastructure-actions/pelican@main
        with:
          destination: ${{ github.ref_name == 'main' && 'asf-site' || 'asf-staging' }}
          gfm: 'true'
          requirements: 'requirements.txt'
